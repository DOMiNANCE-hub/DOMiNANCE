name: DOMiNANCE CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev/firebase-development-readiness

permissions:
  contents: read

concurrency:
  group: dominance-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run offline tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build (without live Firebase credentials)
        run: npm run build
